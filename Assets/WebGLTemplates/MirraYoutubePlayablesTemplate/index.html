<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sand</title>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#173936; color:#fff; font-family:Arial,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; }
    #game { position:relative; height:min(100vh,177.7778vw); width:min(100vw,75vh); }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#173936; gap:20px; }
    progress { width:65%; accent-color:#edc785; }
    #save-status { position:absolute; bottom:8px; left:5%; width:90%; padding:8px; box-sizing:border-box; background:#173936e8; font-size:13px; text-align:center; pointer-events:none; }
    #save-status:empty { display:none; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading"><span id="loading-text">Loading…</span><progress id="progress" max="1" value="0"></progress></div>
    <div id="save-status" role="status"></div>
  </main>
  <script src="ytgame-lifecycle.js"></script>
  <script>
    window.YTGameLifecycle = createYTGameLifecycle(window.ytgame, {
      status: function (text) { document.getElementById('save-status').textContent = text; },
      onReady: function () { document.getElementById('loading').style.display = 'none'; }
    });
    YTGameLifecycle.initialize();
    window.unityGameInstance = null;
  </script>
  <script src="lib/jszip.min.js"></script>
  <script src="unityApp.js"></script>
  <script>
    unityApp.start({
      loaderUrl: 'Build/{{{ LOADER_FILENAME }}}',
      dataUrl: 'Build/{{{ DATA_FILENAME }}}.zip', dataName: '{{{ DATA_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}.zip', codeName: '{{{ CODE_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    }).catch(function (error) {
      document.getElementById('loading-text').textContent = 'Unable to load the game. Please reload.';
      console.error(error);
    });
  </script>
</body>
</html>
